name: Release

# Run from Actions → Release → "Run workflow".
# Picks the next semver (patch/minor/major), updates the csproj, tags, builds, and publishes the exe.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump from the latest release tag
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Bump version
        id: ver
        shell: pwsh
        run: |
          $lines = powershell -ExecutionPolicy Bypass -File .\build\bump-version.ps1 -Bump "${{ inputs.bump }}" -Write
          $map = @{}
          foreach ($line in $lines) {
            if ($line -match '^(current|version|tag)=(.+)$') { $map[$Matches[1]] = $Matches[2] }
          }
          if (-not $map.version) { throw "bump-version.ps1 did not emit version=" }
          "current=$($map.current)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$($map.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$($map.tag)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release $($map.current) -> $($map.version) ($($map.tag))"

      - name: Guard against existing tag
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          if (git rev-parse -q --verify "refs/tags/$tag" 2>$null) {
            throw "Tag $tag already exists. Choose a higher bump or delete the tag."
          }

      - name: Package win-x64 executable
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\build\package.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Commit version bump and push tag
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $tag = "${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FCB1010.App/FCB1010.App.csproj
          git commit -m "chore(release): bump version to $version"
          git tag -a $tag -m "FCB1010 Studio $version"
          git push origin HEAD
          git push origin $tag

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FCB1010Studio-${{ steps.ver.outputs.version }}-win-x64
          path: |
            artifacts/dist/FCB1010Studio-${{ steps.ver.outputs.version }}-win-x64.zip
            artifacts/dist/FCB1010Studio-${{ steps.ver.outputs.version }}-win-x64.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: FCB1010 Studio ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/dist/FCB1010Studio-${{ steps.ver.outputs.version }}-win-x64.zip
            artifacts/dist/FCB1010Studio-${{ steps.ver.outputs.version }}-win-x64.exe
          body: |
            ## Download

            - **FCB1010Studio-${{ steps.ver.outputs.version }}-win-x64.zip** — recommended (exe + README)
            - **FCB1010Studio-${{ steps.ver.outputs.version }}-win-x64.exe** — single self-contained executable

            Windows x64. No .NET runtime install required. Unblock the file if SmartScreen warns on first run (Right-click → Properties → Unblock).

            ## MIDI

            Select IN/OUT ports, LINK, then READ from the FCB1010. See the repository README for setup and UnO notes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
